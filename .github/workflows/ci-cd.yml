name: NexaStream CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'
  NEXT_PUBLIC_DOMAIN: 'nexastream.org'

jobs:
  # Job 1: Lint e Test (Backend)
  backend-test:
    name: Backend - Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (auth service)
        working-directory: ./services/auth
        run: npm ci

      - name: Install dependencies (videos service)
        working-directory: ./services/videos
        run: npm ci

      - name: Install dependencies (core service)
        working-directory: ./services/core
        run: npm ci

      - name: Run tests (auth service)
        working-directory: ./services/auth
        run: npm test || echo "No tests found"

      - name: Run tests (videos service)
        working-directory: ./services/videos
        run: npm test || echo "No tests found"

  # Job 2: Lint e Test (Frontend)
  frontend-test:
    name: Frontend - Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Lint
        working-directory: ./apps/web
        run: npm run lint || echo "Lint not configured"

      - name: Build
        working-directory: ./apps/web
        run: npm run build

  # Job 3: Security Audit
  security-audit:
    name: Security - Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit dependencies (apps/web)
        working-directory: ./apps/web
        run: |
          npm audit --audit-level=high || true
          npm audit --audit-level=critical

      - name: Audit dependencies (services/auth)
        working-directory: ./services/auth
        run: |
          npm audit --audit-level=high || true
          npm audit --audit-level=critical

      - name: Audit dependencies (services/videos)
        working-directory: ./services/videos
        run: |
          npm audit --audit-level=high || true
          npm audit --audit-level=critical

  # Job 4: Deploy (Frontend - Vercel)
  deploy-frontend:
    name: Deploy - Frontend (Vercel)
    needs: [frontend-test, security-audit]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Build
        working-directory: ./apps/web
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--prod'
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/web

  # Job 5: Deploy (Backend - Railway)
  deploy-backend:
    name: Deploy - Backend (Railway)
    needs: [backend-test, security-audit]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd services/core
          railway up --detach
          cd ../../services/auth
          railway up --detach
          cd ../../services/videos
          railway up --detach
