<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexaStream — Global Video Platform | Web3, Blockchain, NST Mining</title>
<meta name="description" content="NexaStream — global decentralized video platform. MAINNET LIVE. NST mining active. Cloudflare R2 storage (zero egress). Web3 wallet login, DAO governance, NFTs, AI recommendations. 10 languages. 263 tests." />
<meta name="keywords" content="video platform, blockchain, web3, NST, decentralized, creator economy, mining, stablecoin, P2P, R2, Cloudflare, DAO, NFT, AI recommendations, i18n" />
<meta property="og:title" content="NexaStream — Global Video Platform" />
<meta property="og:description" content="Decentralized video platform with instant monetization, NST mining, 50/50 economy." />
<meta property="og:url" content="https://nexastream.org/" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="canonical" href="https://nexastream.org/" />
<link rel="manifest" href="/manifest.json" />

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NEXASTREAM"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-NEXASTREAM', { send_page_view: false });

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--p:#8b5cf6;--s:#ec4899;--g:#10b981;--r:#ef4444;--y:#f59e0b;--bg:#0b0b12;--bg2:#12121c;--bd:#262636;--t:#f5f5fa;--m:#9a9ab0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.6;overflow-x:hidden}
a{color:var(--p);text-decoration:none}
.container{max-width:1200px;margin:0 auto;padding:20px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.nav-l,.nav-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;background:linear-gradient(135deg,var(--p),var(--s));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.live-badge{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.4);color:#6ee7b7;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.nl{color:var(--m);font-size:13px;font-weight:500;cursor:pointer}
.nl:hover{color:var(--t)}
.btn-p{padding:7px 16px;background:linear-gradient(135deg,var(--p),var(--s));color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
.btn-g{padding:7px 16px;background:rgba(255,255,255,.06);color:var(--t);border:1px solid var(--bd);border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
.btn-google{padding:10px 20px;background:#fff;color:#333;border:1px solid #ddd;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;width:100%;margin-bottom:10px}
.ui{color:var(--m);font-size:13px}
.lang-select{background:var(--bg2);color:var(--t);border:1px solid var(--bd);border-radius:6px;padding:4px 8px;font-size:12px}
.load{color:var(--m);text-align:center;padding:40px}
.empty{text-align:center;padding:60px 20px}
.empty h2{margin-bottom:8px}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:16px}
.vc{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s}
.vc:hover{transform:translateY(-3px)}
.vt{aspect-ratio:16/9;background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(236,72,153,.1));display:flex;align-items:center;justify-content:center;position:relative}
.pi{font-size:32px;color:rgba(255,255,255,.4)}
.sp-tag{position:absolute;top:6px;left:6px;background:rgba(245,158,11,.9);color:#000;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700}
.vi{padding:10px}
.vi h3{font-size:14px;margin-bottom:3px}
.vm{color:var(--m);font-size:12px}
.fh{margin-bottom:16px}
.fh h1{font-size:24px}
.fh p{color:var(--m);font-size:13px}
.sponsored-banner{margin-bottom:16px}
.ad-slot{background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.2);border-radius:8px;padding:12px;font-size:13px}
.auth{max-width:380px;margin:50px auto;text-align:center}
.auth h1{margin-bottom:16px}
.af{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.af input,.af textarea,.uf input,.uf textarea,.uf select{padding:10px;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;color:var(--t);font-size:14px}
.uf{display:flex;flex-direction:column;gap:10px;max-width:560px}
.pb{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}
.pf{height:100%;width:0%;background:linear-gradient(135deg,var(--p),var(--s));transition:width .3s}
.wp{max-width:860px;margin:0 auto}
.pp{aspect-ratio:16/9;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:16px}
.wm{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.wm div{display:flex;gap:6px}
.vc-box{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}
.vc-box code{color:var(--p);font-size:12px}
.cs{margin-top:16px}
.ci{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.ci textarea{min-height:50px}
.cm{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:6px}
.sc{padding:16px;border-radius:10px;margin-top:16px}
.sc.ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3)}
.sc.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3)}
.sp input{width:100%;padding:10px;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;color:var(--t);font-size:15px;margin-bottom:14px}
.pi-box{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:16px;margin-bottom:16px}
.dash{max-width:900px;margin:0 auto}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.dash-card{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:16px;text-align:center}
.big-num{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--p),var(--s));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-top:6px}
.dash-actions{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.modal{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:20px;max-width:400px;margin:0 auto}
.modal input,.modal select{width:100%;padding:10px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;color:var(--t);margin-bottom:10px}
.ga-data{color:var(--m);font-size:13px;padding:14px;background:var(--bg2);border-radius:8px}
.channel-list{display:grid;gap:12px}
.channel-card{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:14px}
.ch-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--s));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.center{text-align:center;padding:60px}
.err{color:var(--r);text-align:center;padding:40px}
@media(max-width:600px){.vg{grid-template-columns:1fr}.nav-l{gap:6px}.nl{font-size:12px}.dash-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/app.js"></script>
</body>
</html>
