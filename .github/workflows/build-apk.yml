name: Build Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install deps
        run: pnpm install --frozen-lockfile=false

      - name: Build shared
        run: pnpm --filter @nexastream/shared run build

      - name: Prepare PWA assets for APK
        run: |
          mkdir -p frontend/out
          cp index.html frontend/out/index.html
          cp frontend/public/manifest.json frontend/out/manifest.json
          cp frontend/public/sw.js frontend/out/sw.js
          echo "nexastream.org" > frontend/out/CNAME

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
        continue-on-error: true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexastream-apk
          path: |
            frontend/android/app/build/outputs/apk/debug/*.apk
            frontend/out/
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/android/app/build/outputs/apk/debug/*.apk
            frontend/out/index.html
            frontend/out/manifest.json
            frontend/out/sw.js
          body: |
            NexaStream Android APK + PWA.
            
            ## Downloads:
            - **Android APK**: baixe o arquivo .apk abaixo
            - **PWA (todas as plataformas)**: visite https://nexastream.org/ e instale como app
            - **Windows/Mac/Linux/iOS**: instale o PWA pelo navegador
            
            ## Mining NST:
            Mining via PoW implementado. Ativo quando testnet for implantada.
            
            186 testes passando.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
