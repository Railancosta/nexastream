# KIND Configuration for Local Development
# Run: kind create cluster --config=k8s/kind-config.yaml

---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: nexastream
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
    labels:
      ingress-ready: "true"
      node-role: control-plane
  - role: worker
    labels:
      node-role: worker
      storage-node: "true"
  - role: worker
    labels:
      node-role: worker
      storage-node: "true"
---
# Storage Class for local development
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: local-path
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rancher.io/local-path
volumeBindMode: "Immediate"
reclaimPolicy: Delete
---
# Override storage class in deployment manifests
# Change storageClassName from "nexastream-gp3" to "local-path" for local development
