# NexaStream SLO/SLA Definitions
# Service Level Objectives and Service Level Agreements

service_level_objectives:
  # ==========================================
  # API SLOs
  # ==========================================
  api:
    name: "NexaStream API"
    tier: "gold"
    
    availability:
      target: 99.95%
      window: 30d
      error_budget: 21.6 minutes / day
      measurement: |
        1 - (sum(rate(http_requests_total{status=~"5.."})) 
        / sum(rate(http_requests_total)))
    
    latency:
      p50_target: 100ms
      p95_target: 500ms
      p99_target: 1s
      window: 5m
      measurement: |
        histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))

    throughput:
      min_rps: 1000
      max_rps: 100000
      target: "handle 10,000 RPS sustainably"

    errors:
      budget: 0.05%
      classification:
        - type: server_error
          severity: critical
          response_codes: [500, 502, 503, 504]
        - type: client_error
          severity: warning
          response_codes: [400, 401, 403, 404, 429]
    
    health_endpoints:
      - /api/health
      - /api/v1/health

  # ==========================================
  # BLOCKCHAIN SLOs
  # ==========================================
  blockchain:
    name: "NexaChain Blockchain"
    tier: "platinum"
    
    availability:
      target: 99.99%
      window: 30d
      error_budget: 4.3 minutes / day
      measurement: |
        1 - (sum(rate(nexachain_blocks_failed_total)) 
        / sum(rate(nexachain_blocks_produced_total)))
    
    block_production:
      target: "1 block every 3 seconds"
      max_gap: 30s
      alert_threshold: 10s
    
    consensus:
      target: "100% finality within 2 blocks"
      measurement: |
        rate(nexachain_finalized_blocks_total) / rate(nexachain_blocks_produced_total)
    
    transaction_throughput:
      target: 5000 TPS
      current: 2000 TPS
      measurement: |
        rate(nexachain_transactions_total[1m])
    
    gas_price:
      target: "< 1 NST per transaction"
      alert_threshold: "> 10 NST"

  # ==========================================
  # STORAGE SLOs
  # ==========================================
  storage:
    name: "NexaStream Storage"
    tier: "gold"
    
    availability:
      target: 99.9%
      window: 30d
      error_budget: 43.8 minutes / day
    
    upload_success:
      target: 99.5%
      measurement: |
        1 - (rate(nexastream_upload_errors_total) 
        / rate(nexastream_uploads_total))
    
    download_success:
      target: 99.9%
      measurement: |
        1 - (rate(nexastream_download_errors_total) 
        / rate(nexastream_downloads_total))
    
    latency:
      p95_upload: 10s
      p95_download: 5s
      p95_stream: 2s
    
    durability:
      target: 99.999999%
      measurement: |
        1 - (nexastream_lost_files_total / nexastream_total_files)

  # ==========================================
  # STREAMING SLOs
  # ==========================================
  streaming:
    name: "NexaStream Streaming"
    tier: "silver"
    
    availability:
      target: 99.5%
      window: 30d
    
    stream_quality:
      target: "720p minimum for all streams"
      measurement: |
        rate(nexastream_stream_quality_issues_total)
    
    transcoding:
      target: "Complete within 4x video duration"
      max_wait: 30m
      measurement: |
        nexastream_transcoding_queue_size < 100
    
    viewer_capacity:
      target: "100,000 concurrent viewers"
      max_per_stream: 100000
    
    latency:
      target: "< 5 seconds end-to-end latency"
      measurement: |
        histogram_quantile(0.95, rate(nexastream_stream_latency_seconds_bucket[5m]))

  # ==========================================
  # FRONTEND SLOs
  # ==========================================
  frontend:
    name: "NexaStream Frontend"
    tier: "gold"
    
    availability:
      target: 99.9%
      window: 30d
    
    page_load:
      target: "< 3 seconds (LCP)"
      measurement: |
        histogram_quantile(0.95, nexastream_page_load_seconds)
    
    time_to_interactive:
      target: "< 5 seconds"
      measurement: |
        histogram_quantile(0.95, nexastream_tti_seconds)
    
    javascript_errors:
      target: "< 0.1%"
      measurement: |
        rate(nexastream_js_errors_total) / rate(nexastream_page_views_total)

# ==========================================
# SERVICE LEVEL AGREEMENTS
# ==========================================
service_level_agreements:
  tier_platinum:
    name: "Platinum SLA"
    services: ["blockchain"]
    
    availability: 99.99%
    response_time:
      critical: 15 minutes
      high: 1 hour
      medium: 4 hours
      low: 24 hours
    
    credits:
      - threshold: 99.9%
        credit: 10%
      - threshold: 99.0%
        credit: 25%
      - threshold: 95.0%
        credit: 50%
      - threshold: 90.0%
        credit: 100%

  tier_gold:
    name: "Gold SLA"
    services: ["api", "storage", "frontend"]
    
    availability: 99.95%
    response_time:
      critical: 30 minutes
      high: 4 hours
      medium: 8 hours
      low: 48 hours
    
    credits:
      - threshold: 99.5%
        credit: 10%
      - threshold: 99.0%
        credit: 25%
      - threshold: 95.0%
        credit: 50%

  tier_silver:
    name: "Silver SLA"
    services: ["streaming"]
    
    availability: 99.5%
    response_time:
      critical: 1 hour
      high: 8 hours
      medium: 24 hours
      low: 72 hours
    
    credits:
      - threshold: 99.0%
        credit: 10%
      - threshold: 95.0%
        credit: 25%

# ==========================================
# ERROR BUDGET POLICIES
# ==========================================
error_budget_policies:
  default:
    burn_rate_alert: 14.4x  # Alert when consuming 1 day of budget in 1 hour
    budget_target: 100%
    
    actions:
      - when: burn_rate > 6x
        severity: critical
        action: "On-call immediately, page"
      - when: burn_rate > 3x
        severity: warning
        action: "Engineering investigate within 1 hour"
      - when: burn_rate > 1x
        severity: info
        action: "Engineering review within 24 hours"
  
  aggressive:
    burn_rate_alert: 6.48x  # 4 days budget in 14.4 hours
    
  conservative:
    burn_rate_alert: 57.6x  # 4 days budget in 1.6 hours

# ==========================================
# REPORTING
# ==========================================
reporting:
  weekly:
    recipients: ["engineering@nexastream.org", "product@nexastream.org"]
    include:
      - error_budget_status
      - burn_rate
      - incidents
      - trends
  
  monthly:
    recipients: ["leadership@nexastream.org"]
    include:
      - all_weekly
      - slo_compliance
      - improvement_projects
      - financial_impact
  
  quarterly:
    recipients: ["executive@nexastream.org"]
    include:
      - all_monthly
      - strategic_recommendations
      - capacity_planning

# ==========================================
# INCIDENT CLASSIFICATION
# ==========================================
incident_classification:
  severity_1:
    name: "SEV1 - Critical"
    description: "Complete service outage or data loss"
    response_time: 15 minutes
    resolution_target: 1 hour
    communication: Every 30 minutes
    
  severity_2:
    name: "SEV2 - High"
    description: "Major feature unavailable or degraded"
    response_time: 30 minutes
    resolution_target: 4 hours
    communication: Every 1 hour
    
  severity_3:
    name: "SEV3 - Medium"
    description: "Minor feature degradation or non-critical issue"
    response_time: 2 hours
    resolution_target: 24 hours
    communication: Every 4 hours
    
  severity_4:
    name: "SEV4 - Low"
    description: "Cosmetic issues or minor bugs"
    response_time: 24 hours
    resolution_target: 1 week
    communication: Daily

# ==========================================
# MAINTENANCE WINDOWS
# ==========================================
maintenance:
  scheduled:
    frequency: weekly
    duration: 4 hours
    window: "Sunday 02:00-06:00 UTC"
    notification: 72 hours in advance
    
  emergency:
    allowed: true
    communication: Real-time
    post_incident_review: Required

# ==========================================
# CAPACITY THRESHOLDS
# ==========================================
capacity_thresholds:
  compute:
    cpu_warning: 70%
    cpu_critical: 85%
    memory_warning: 75%
    memory_critical: 90%
    
  storage:
    disk_warning: 70%
    disk_critical: 85%
    iops_warning: 60%
    iops_critical: 80%
    
  network:
    bandwidth_warning: 60%
    bandwidth_critical: 80%
    latency_warning: 100ms
    latency_critical: 500ms
    
  application:
    connection_warning: 70%
    connection_critical: 90%
    queue_warning: 1000
    queue_critical: 5000
