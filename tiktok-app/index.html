<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>NexaStream - TikTok Style</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { height: 100%; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #000; color: #fff; }
    .app { height: 100%; display: flex; flex-direction: column; }
    
    /* Video Feed */
    .feed { flex: 1; position: relative; overflow: hidden; }
    .video-container { height: 100%; width: 100%; position: relative; }
    .video { width: 100%; height: 100%; object-fit: cover; background: #111; }
    .video-overlay { position: absolute; bottom: 100px; left: 0; right: 80px; padding: 16px; }
    .username { font-weight: 700; font-size: 16px; margin-bottom: 8px; }
    .description { font-size: 14px; opacity: 0.9; line-height: 1.4; }
    
    /* Actions */
    .actions { position: absolute; right: 8px; bottom: 120px; display: flex; flex-direction: column; gap: 16px; }
    .action-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: #fff; cursor: pointer; }
    .action-icon { width: 40px; height: 40px; background: rgba(0,0,0,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .action-count { font-size: 12px; font-weight: 600; }
    
    /* Music */
    .music { position: absolute; bottom: 20px; left: 16px; display: flex; align-items: center; gap: 8px; }
    .music-icon { width: 24px; height: 24px; border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .music-title { font-size: 12px; opacity: 0.8; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    /* Bottom Nav */
    .nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #666; font-size: 10px; cursor: pointer; }
    .nav-item.active { color: #ff0050; }
    .nav-icon { font-size: 24px; }
    
    /* Subscribe Button */
    .subscribe-btn { position: absolute; top: 60px; right: 16px; background: linear-gradient(135deg, #ff0050, #ff4d00); padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }
    
    /* Subscription Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
    .modal { background: #111; border-radius: 20px 20px 0 0; width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; padding: 24px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .modal-title { font-size: 20px; font-weight: 700; }
    .modal-close { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
    .plan-card { background: #222; border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 2px solid transparent; cursor: pointer; transition: all 0.3s; }
    .plan-card.selected { border-color: #ff0050; background: #2a0a15; }
    .plan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .plan-name { font-weight: 700; font-size: 18px; }
    .plan-price { font-size: 24px; font-weight: 700; color: #ff0050; }
    .plan-period { font-size: 12px; color: #888; }
    .plan-features { list-style: none; font-size: 13px; color: #aaa; }
    .plan-features li { padding: 4px 0; }
    .plan-features li::before { content: '✓ '; color: #00ff88; margin-right: 8px; }
    .subscribe-btn-modal { width: 100%; padding: 16px; background: linear-gradient(135deg, #ff0050, #ff4d00); border: none; border-radius: 30px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 16px; }
    
    /* Loading */
    .loading { display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; gap: 16px; }
    .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #ff0050; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Empty State */
    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 40px; }
    .empty-icon { font-size: 64px; margin-bottom: 16px; }
    .empty-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .empty-text { color: #888; font-size: 14px; }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">
      <div class="spinner"></div>
      <p>Carregando...</p>
    </div>
  </div>

  <script>
    const API_URL = 'https://nexastream.org';

    // State
    let currentUser = null;
    let currentPlan = 'free';
    let currentVideoIndex = 0;
    let videos = [];
    let touchStartY = 0;

    // Plans
    const PLANS = {
      free: { name: 'Grátis', price: 0, features: ['5 uploads/dia', 'Vídeos com marca d\'água', '100 visualizações', 'Sem suporte prioritário'] },
      pro: { name: 'PRO', price: 9.90, period: '/mês', features: ['Vídeos ilimitados', 'Sem marca d\'água', '10.000 visualizações', 'Estatísticas avançadas', 'Suporte prioritário', 'Remoção de anúncios'] },
      premium: { name: 'PREMIUM', price: 29.90, period: '/mês', features: ['Tudo do PRO', '100.000 visualizações', 'Prioridade de descoberta', 'Gestor de conta', 'API access', 'White-label'] }
    };

    // Render App
    function render() {
      const root = document.getElementById('root');
      
      if (!currentUser) {
        root.innerHTML = `
          <div class="app">
            <div class="empty">
              <div class="empty-icon">📱</div>
              <h2 class="empty-title">NexaStream</h2>
              <p class="empty-text">Plataforma de vídeos estilo TikTok<br>com blockchain e recompensas</p>
              <button onclick="login()" style="margin-top: 24px; padding: 16px 32px; background: linear-gradient(135deg, #ff0050, #ff4d00); border: none; border-radius: 30px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;">
                Entrar / Registrar
              </button>
            </div>
            ${renderNav()}
          </div>
        `;
        return;
      }

      root.innerHTML = `
        <div class="app">
          ${renderFeed()}
          ${renderNav()}
        </div>
      `;
    }

    function renderFeed() {
      if (videos.length === 0) {
        return `
          <div class="feed">
            <div class="empty">
              <div class="empty-icon">🎬</div>
              <h2 class="empty-title">Nenhum vídeo ainda</h2>
              <p class="empty-text">Seja o primeiro a postar!</p>
              <button onclick="loadVideos()" style="margin-top: 16px; padding: 12px 24px; background: #333; border: none; border-radius: 20px; color: #fff; cursor: pointer;">
                Carregar Vídeos
              </button>
            </div>
          </div>
        `;
      }

      const video = videos[currentVideoIndex];
      return `
        <div class="feed">
          <div class="video-container" ontouchstart="handleTouchStart(event)" onTouchend="handleTouchEnd(event)">
            <video class="video" src="${video.video_url}" autoplay loop muted playsinline></video>
            
            <button class="subscribe-btn" onclick="showPlans()">ASSINE</button>
            
            <div class="video-overlay">
              <div class="username">@${video.channel_handle || 'user'}</div>
              <div class="description">${video.title}</div>
            </div>
            
            <div class="actions">
              <button class="action-btn" onclick="likeVideo('${video.id}')">
                <div class="action-icon">❤️</div>
                <span class="action-count">${video.likes || 0}</span>
              </button>
              <button class="action-btn" onclick="commentVideo('${video.id}')">
                <div class="action-icon">💬</div>
                <span class="action-count">${video.comments_count || 0}</span>
              </button>
              <button class="action-btn" onclick="shareVideo('${video.id}')">
                <div class="action-icon">↗️</div>
                <span class="action-count">${video.shares || 0}</span>
              </button>
              <button class="action-btn" onclick="saveVideo('${video.id}')">
                <div class="action-icon">🔖</div>
                <span class="action-count">${video.saves || 0}</span>
              </button>
            </div>
            
            <div class="music">
              <div class="music-icon">🎵</div>
              <span class="music-title">${video.channel_name || 'NexaStream Music'}</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderNav() {
      return `
        <nav class="nav">
          <div class="nav-item active" onclick="goHome()">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
          </div>
          <div class="nav-item" onclick="showDiscover()">
            <span class="nav-icon">🔍</span>
            <span>Descobrir</span>
          </div>
          <div class="nav-item" onclick="showUpload()" style="font-size: 32px; color: #ff0050;">+</div>
          <div class="nav-item" onclick="showNotifications()">
            <span class="nav-icon">🔔</span>
            <span>Notificações</span>
          </div>
          <div class="nav-item" onclick="showProfile()">
            <span class="nav-icon">👤</span>
            <span>Perfil</span>
          </div>
        </nav>
      `;
    }

    function showPlans() {
      const root = document.getElementById('root');
      root.innerHTML = `
        <div class="modal-overlay" onclick="render()">
          <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
              <h2 class="modal-title">Assine o NexaStream</h2>
              <button class="modal-close" onclick="render()">✕</button>
            </div>
            
            <div class="plan-card ${currentPlan === 'free' ? 'selected' : ''}" onclick="selectPlan('free')">
              <div class="plan-header">
                <span class="plan-name">${PLANS.free.name}</span>
                <span class="plan-price">GRÁTIS</span>
              </div>
              <ul class="plan-features">
                ${PLANS.free.features.map(f => `<li>${f}</li>`).join('')}
              </ul>
            </div>
            
            <div class="plan-card ${currentPlan === 'pro' ? 'selected' : ''}" onclick="selectPlan('pro')">
              <div class="plan-header">
                <span class="plan-name">${PLANS.pro.name}</span>
                <span class="plan-price">R$ ${PLANS.pro.price}<span class="plan-period">${PLANS.pro.period}</span></span>
              </div>
              <ul class="plan-features">
                ${PLANS.pro.features.map(f => `<li>${f}</li>`).join('')}
              </ul>
            </div>
            
            <div class="plan-card ${currentPlan === 'premium' ? 'selected' : ''}" onclick="selectPlan('premium')">
              <div class="plan-header">
                <span class="plan-name">${PLANS.premium.name}</span>
                <span class="plan-price">R$ ${PLANS.premium.price}<span class="plan-period">${PLANS.premium.period}</span></span>
              </div>
              <ul class="plan-features">
                ${PLANS.premium.features.map(f => `<li>${f}</li>`).join('')}
              </ul>
            </div>
            
            <button class="subscribe-btn-modal" onclick="checkout()">
              ${currentPlan === 'free' ? 'Plano Atual' : `Assinar por R$ ${PLANS[currentPlan].price}/mês`}
            </button>
          </div>
        </div>
      `;
    }

    function selectPlan(plan) {
      currentPlan = plan;
      showPlans();
    }

    function checkout() {
      if (currentPlan === 'free') {
        alert('Você já está no plano grátis!');
        return;
      }
      alert(`Redirecionando para pagamento...\n\nPlano: ${PLANS[currentPlan].name}\nValor: R$ ${PLANS[currentPlan].price}/mês\n\nFuncionalidade de pagamento será integrada com Stripe.`);
    }

    async function login() {
      const email = prompt('Digite seu email:');
      if (!email) return;
      
      const password = prompt('Digite sua senha:');
      if (!password) return;

      try {
        const res = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        if (res.ok) {
          const data = await res.json();
          currentUser = data.user;
          localStorage.setItem('token', data.token);
          loadVideos();
        } else {
          register(email, password);
        }
      } catch (e) {
        currentUser = { email, username: email.split('@')[0] };
        loadVideos();
      }
      render();
    }

    function register(email, password) {
      const username = prompt('Escolha um username:');
      if (!username) return;
      
      currentUser = { email, username };
      render();
    }

    async function loadVideos() {
      try {
        const res = await fetch(`${API_URL}/api/recommendations/for-you?limit=20`);
        if (res.ok) {
          const data = await res.json();
          videos = data.videos || [];
        }
      } catch (e) {
        videos = [];
      }
      render();
    }

    function handleTouchStart(e) {
      touchStartY = e.touches[0].clientY;
    }

    function handleTouchEnd(e) {
      const touchEndY = e.changedTouches[0].clientY;
      const diff = touchStartY - touchEndY;
      
      if (Math.abs(diff) > 50) {
        if (diff > 0 && currentVideoIndex < videos.length - 1) {
          currentVideoIndex++;
        } else if (diff < 0 && currentVideoIndex > 0) {
          currentVideoIndex--;
        }
        render();
      }
    }

    function likeVideo(id) {
      fetch(`${API_URL}/api/analytics/engage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ video_id: id, type: 'like' })
      });
      const video = videos.find(v => v.id === id);
      if (video) video.likes = (video.likes || 0) + 1;
      render();
    }

    function commentVideo(id) { alert('Comentários em breve!'); }
    function shareVideo(id) { alert('Compartilhado!'); }
    function saveVideo(id) { alert('Salvo!'); }
    function goHome() { loadVideos(); }
    function showDiscover() { alert('Descobrir em breve!'); }
    function showUpload() { alert('Upload em breve!'); }
    function showNotifications() { alert('Notificações em breve!'); }
    function showProfile() { alert('Perfil em breve!'); }

    // Check login
    const token = localStorage.getItem('token');
    if (token) {
      fetch(`${API_URL}/api/auth/me`, { headers: { Authorization: `Bearer ${token}` } })
        .then(r => r.ok ? r.json() : null)
        .then(d => { if (d) currentUser = d.user; loadVideos(); })
        .catch(() => loadVideos());
    } else {
      render();
    }
  </script>
</body>
</html>
