name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NEXT_PUBLIC_APP_URL: https://nexastream.org
  NEXT_PUBLIC_DOMAIN: nexastream.org
  NEXT_PUBLIC_API_URL: https://api.nexastream.org

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      
      - name: Build Next.js
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://nexastream.org
          NEXT_PUBLIC_DOMAIN: nexastream.org
          NEXT_PUBLIC_API_URL: https://api.nexastream.org
      
      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: nexastream-static-site-v${{ github.run_number }}
          path: frontend/out
          retention-days: 30
      
      - name: Zip for download
        run: |
          cd frontend
          zip -r ../nexastream-v${{ github.run_number }}.zip out
      
      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: nexastream-zip-v${{ github.run_number }}
          path: nexastream-v${{ github.run_number }}.zip
          retention-days: 30
