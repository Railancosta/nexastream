<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexaStream — Web3 Video Platform</title>
<meta name="description" content="NexaStream — the Web3 decentralized video platform. Watch, create, and earn NST tokens. Blockchain-native, community-owned." />
<meta name="keywords" content="web3 video, blockchain video, decentralized video, NST token, creator economy, dapp video" />
<meta property="og:title" content="NexaStream — Web3 Video Platform" />
<meta property="og:description" content="Watch, create, and earn NST. The decentralized video platform." />
<meta property="og:url" content="https://nexastream.org/" />
<link rel="canonical" href="https://nexastream.org/" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#8b5cf6" />
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--p:#8b5cf6;--s:#ec4899;--a:#06b6d4;--g:#10b981;--r:#ef4444;--y:#f59e0b;--bg:#0a0a0f;--bg2:#14141e;--bg3:#1c1c2a;--bd:#2a2a3a;--t:#f0f0f5;--m:#8b8ba0;--m2:#5a5a70}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t);line-height:1.5;overflow-x:hidden}
a{color:var(--p);text-decoration:none}
button{cursor:pointer;font-family:inherit}
.container{max-width:1400px;margin:0 auto;padding:0 16px}
/* Sidebar */
.sidebar{position:fixed;left:0;top:56px;bottom:0;width:240px;background:var(--bg2);border-right:1px solid var(--bd);overflow-y:auto;z-index:90;transition:transform .2s}
.sidebar-item{display:flex;align-items:center;gap:14px;padding:10px 24px;color:var(--m);font-size:14px;font-weight:500;cursor:pointer;transition:.15s}
.sidebar-item:hover{background:var(--bg3);color:var(--t)}
.sidebar-item.active{background:var(--bg3);color:var(--t);border-left:3px solid var(--p)}
.sidebar-divider{height:1px;background:var(--bd);margin:8px 24px}
.sidebar-label{padding:4px 24px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--m2)}
/* Main content */
.main{margin-left:240px;padding:16px 16px 40px;min-height:calc(100vh - 56px)}
/* Chips */
.chips{display:flex;gap:8px;padding:0 0 16px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;background:var(--bg3);border:1px solid var(--bd);border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;transition:.15s}
.chip.active{background:var(--t);color:var(--bg)}
.chip:hover{background:var(--bd)}
/* Video grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--bg2);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,var(--bg3),var(--bg2));display:flex;align-items:center;justify-content:center;position:relative}
.thumb-icon{font-size:40px;opacity:.3}
.duration{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.8);padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600}
.card-info{display:flex;gap:10px;padding:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--s));flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.card-text{flex:1;min-width:0}
.card-title{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:12px;color:var(--m);margin-top:3px}
/* Empty */
.empty{text-align:center;padding:60px 20px}
.empty h2{font-size:22px;margin-bottom:8px}
.empty p{color:var(--m);margin-bottom:16px}
/* Auth */
.auth{max-width:400px;margin:60px auto;text-align:center}
.auth h1{font-size:28px;margin-bottom:16px}
.auth p{color:var(--m);margin-bottom:20px}
/* Forms */
.form{display:flex;flex-direction:column;gap:12px}
.form input,.form textarea{padding:12px;background:var(--bg3);border:1px solid var(--bd);border-radius:8px;color:var(--t);font-size:14px;outline:none}
.form input:focus,.form textarea:focus{border-color:var(--p)}
.form textarea{min-height:80px;resize:vertical}
/* Buttons */
.btn-p{padding:10px 20px;background:linear-gradient(135deg,var(--p),var(--s));color:#fff;border:none;border-radius:8px;font-weight:600;font-size:14px;transition:transform .1s}
.btn-p:hover{transform:translateY(-1px)}
.btn-g{padding:10px 20px;background:var(--bg3);color:var(--t);border:1px solid var(--bd);border-radius:8px;font-weight:600;font-size:14px}
.btn-g:hover{background:var(--bd)}
/* Status */
.sc{padding:20px;border-radius:12px;text-align:center}
.sc.ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3)}
.sc.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3)}
/* Dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.dash-card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:16px;text-align:center}
.big-num{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--p),var(--s));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-top:6px}
.dash-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.modal{background:var(--bg3);border:1px solid var(--bd);border-radius:12px;padding:20px;max-width:400px;margin:0 auto}
.modal input{width:100%;padding:10px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;color:var(--t);margin-bottom:10px}
/* Live badge */
.live-badge{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.4);color:#6ee7b7;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.main{margin-left:0}.grid{grid-template-columns:1fr 1fr}.card-title{font-size:13px}}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/app.js"></script>
</body>
</html>
