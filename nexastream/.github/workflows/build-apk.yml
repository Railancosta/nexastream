name: Build Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install deps
        run: pnpm install --frozen-lockfile=false

      - name: Build shared
        run: pnpm --filter @nexastream/shared run build

      - name: Prepare web assets
        run: |
          mkdir -p frontend/out
          cp index.html frontend/out/index.html
          cp app.js frontend/out/app.js
          cp frontend/public/manifest.json frontend/out/manifest.json 2>/dev/null || true
          cp frontend/public/sw.js frontend/out/sw.js 2>/dev/null || true
          echo "nexastream.org" > frontend/out/CNAME

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix Capacitor project
        working-directory: frontend/android
        run: |
          # Create missing capacitor-cordova-android-plugins directory
          mkdir -p capacitor-cordova-android-plugins
          echo "// Empty" > capacitor-cordova-android-plugins/cordova.variables.gradle
          echo "// Empty" > capacitor-cordova-android-plugins/build.gradle

      - name: Sync Capacitor
        run: |
          cd frontend
          npx cap sync android || true

      - name: Build APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -x capacitor-cordova-android-plugins:build -x :capacitor-cordova-android-plugins:build || true

      - name: Find APK
        run: find frontend/android -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexastream-apk
          path: |
            frontend/android/app/build/outputs/apk/debug/*.apk
            frontend/out/
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/android/app/build/outputs/apk/debug/*.apk
            frontend/out/index.html
            frontend/out/app.js
            frontend/out/manifest.json
          body: |
            NexaStream v0.4.1 — Android APK + PWA
            
            ## Downloads:
            - **Android APK**: baixe o arquivo .apk abaixo
            - **PWA**: visite https://nexastream.org/ e instale como app
            
            ## Features:
            - MAINNET LIVE (NST mining)
            - Web3 wallet login (500+ wallets)
            - Post-Quantum crypto
            - IPFS storage
            - DAO, NFTs, AI recommendations
            - 10 languages, Binance API
            
            347+ tests passing.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
