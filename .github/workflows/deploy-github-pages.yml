name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare clean static site
        run: |
          rm -rf ./site
          mkdir -p ./site
          # ONLY the canonical homepage — nothing else from frontend/.
          cp index.html ./site/index.html
          echo "nexastream.org" > ./site/CNAME
          # nojekyll to disable Jekyll processing
          touch ./site/.nojekyll
          # Verify
          echo "=== site contents ==="
          ls -la ./site/
          echo "=== index.html first line ==="
          head -1 ./site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
