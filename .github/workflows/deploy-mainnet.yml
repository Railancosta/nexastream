name: Deploy to Mainnet

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy'
        required: true
        default: 'celo'
        type: choice
        options:
          - celo
          - celoAlfajores
          - sepolia

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: |
          cd contracts
          npm install

      - name: Compile contracts
        run: |
          cd contracts
          npx hardhat compile

      - name: Deploy to Celo Mainnet
        if: github.event.inputs.network == 'celo' || github.event.inputs.network == ''
        run: |
          cd contracts
          npx hardhat run deploy.js --network celo
        env:
          CELO_RPC_URL: ${{ vars.CELO_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          CELOSCAN_API_KEY: ${{ secrets.CELOSCAN_API_KEY }}

      - name: Deploy to Celo Alfajores
        if: github.event.inputs.network == 'celoAlfajores'
        run: |
          cd contracts
          npx hardhat run deploy.js --network celoAlfajores
        env:
          CELO_ALFAJORES_RPC_URL: ${{ vars.CELO_ALFAJORES_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}

      - name: Deploy to Sepolia
        if: github.event.inputs.network == 'sepolia'
        run: |
          cd contracts
          npx hardhat run deploy.js --network sepolia
        env:
          SEPOLIA_RPC_URL: ${{ vars.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}

      - name: Upload deployment info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: contracts/deployment-addresses.json
          retention-days: 30
