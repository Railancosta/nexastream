version: "3.9"

services:
  # PostgreSQL — banco de dados transacional
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexastream
      POSTGRES_USER: nexastream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexastream_dev}
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexastream"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO — storage S3-compatible (local dev)
  # Para produção: use Cloudflare R2 (zero egress fee)
  # Veja: infrastructure/cloudflare/r2-config.md
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-nexastream}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-nexastream_dev}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    restart: unless-stopped

  # API REST
  api:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgres://nexastream:${POSTGRES_PASSWORD:-nexastream_dev}@postgres:5432/nexastream
      JWT_SECRET: ${JWT_SECRET:-change-me-to-64-char-random-string-aaaaaaaaaaaa}
      CORS_ALLOWED_ORIGINS: https://nexastream.org,http://localhost:3000
      STORAGE_DIR: /data/storage
      UPLOAD_TEMP_DIR: /data/uploads
      UPLOAD_CHUNK_SIZE: 8388608
      UPLOAD_MAX_SIZE: 2147483648
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: nexastream
      S3_ACCESS_KEY_ID: ${MINIO_USER:-nexastream}
      S3_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-nexastream_dev}
      S3_FORCE_PATH_STYLE: "true"
    ports: ["4000:4000"]
    volumes: ["api-data:/data"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  # Signaling WebRTC
  signaling:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.signaling
    environment:
      SIGNALING_PORT: 4010
      STUN_URL: stun:stun.l.google.com:19302
    ports: ["4010:4010"]
    restart: unless-stopped

  # Solo Validator (blockchain)
  validator:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.validator
    command: ["--port", "9001", "--interval", "10000"]
    ports: ["9001:9001"]
    volumes: ["validator-data:/data"]
    restart: unless-stopped

volumes:
  pg-data:
  minio-data:
  api-data:
  validator-data:
