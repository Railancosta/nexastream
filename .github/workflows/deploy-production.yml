name: Deploy to Production (nexastream.org)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NEXT_PUBLIC_APP_URL: https://nexastream.org
  NEXT_PUBLIC_DOMAIN: nexastream.org
  NEXT_PUBLIC_API_URL: https://api.nexastream.org

jobs:
  # ===========================================
  # FRONTEND DEPLOY TO GITHUB PAGES
  # ===========================================
  deploy-frontend:
    name: Deploy Frontend to nexastream.org
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build Next.js
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://nexastream.org
          NEXT_PUBLIC_DOMAIN: nexastream.org
          NEXT_PUBLIC_API_URL: https://api.nexastream.org

      - name: Copy static files to out
        run: |
          mkdir -p frontend/out
          cp frontend/public/index.html frontend/out/ 2>/dev/null || true
          cp frontend/public/_redirects frontend/out/ 2>/dev/null || true
          cp frontend/public/404.html frontend/out/ 2>/dev/null || true

      - name: Add CNAME for nexastream.org
        run: echo "nexastream.org" > frontend/out/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4
        with:
          build_type: folder
          output_location: frontend/out

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: |
          echo "## ✅ Deployment Complete"
          echo ""
          echo "| Property | Value |"
          echo "|----------|-------|"
          echo "| Site URL | https://nexastream.org |"
          echo "| Deployment ID | ${{ steps.deployment.outputs.page_id }} |"
          echo "| Run ID | ${{ github.run_id }} |"
          echo "| Commit | ${{ github.sha }} |"

      - name: Create deployment summary
        run: |
          echo "# 🚀 NexaStream Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🌐 Live Site" >> $GITHUB_STEP_SUMMARY
          echo "**https://nexastream.org**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Components" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: Deployed ✅" >> $GITHUB_STEP_SUMMARY
          echo "- SPA Routing: Enabled ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Mobile Optimized: Yes ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Web3 Integration: Yes ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📜 License Plans" >> $GITHUB_STEP_SUMMARY
          echo "- Starter (FREE)" >> $GITHUB_STEP_SUMMARY
          echo "- Pro Creator (49.99 NEXA/month)" >> $GITHUB_STEP_SUMMARY
          echo "- Enterprise (199.99 NEXA/month)" >> $GITHUB_STEP_SUMMARY
          echo "- Lifetime (499.99 NEXA)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ⛓️ Blockchain" >> $GITHUB_STEP_SUMMARY
          echo "- Network: NexaChain Mainnet" >> $GITHUB_STEP_SUMMARY
          echo "- Payment: NEXA, ETH, USDT, USDC, BNB" >> $GITHUB_STEP_SUMMARY
          echo "- NFT Licenses: Enabled" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Run #${{ github.run_number }}** | Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
