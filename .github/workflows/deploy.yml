name: Deploy to Production

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  NEXT_PUBLIC_APP_URL: https://nexastream.org
  NEXT_PUBLIC_DOMAIN: nexastream.org

jobs:
  # Build frontend
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install
      
      - name: Build Next.js
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://nexastream.org
          NEXT_PUBLIC_DOMAIN: nexastream.org
          NEXT_PUBLIC_API_URL: https://api.nexastream.org
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexastream-frontend
          path: frontend/out
          retention-days: 5

  # Deploy to GitHub Pages (if enabled)
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nexastream-frontend
          path: out
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'out'
          retention-days: 5
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
