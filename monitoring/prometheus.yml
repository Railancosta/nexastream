global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: nexastream-dev
    environment: development

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Application services are added only when they expose a real /metrics endpoint.
  # This avoids claiming observability that has not been implemented yet.
