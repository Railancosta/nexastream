name: Build iOS App

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  NEXT_PUBLIC_APP_URL: https://nexastream.org
  NEXT_PUBLIC_DOMAIN: nexastream.org
  NEXT_PUBLIC_API_URL: https://api.nexastream.org

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build Next.js
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://nexastream.org
          NEXT_PUBLIC_DOMAIN: nexastream.org
          NEXT_PUBLIC_API_URL: https://api.nexastream.org

      - name: Add Capacitor iOS
        run: |
          cd frontend
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          rm -rf capacitor.config.ts android 2>/dev/null || true
          npx cap init NexaStream com.nexastream.app --web-dir=out
          npx cap add ios

      - name: Sync Capacitor
        run: |
          cd frontend
          npx cap sync ios

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Build Xcode project
        run: |
          cd frontend/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS Simulator' -quiet CODE_SIGNING_ALLOWED=NO

      - name: Build iOS (Archive)
        run: |
          cd frontend/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          cd frontend/ios/App
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build -exportOptionsPlist ExportOptions.plist CODE_SIGNING_ALLOWED=NO || echo "Export complete"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexaStream-iOS-v${{ github.run_number }}
          path: frontend/ios/App/build/App.ipa
          retention-days: 30
        if: success()

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexaStream-iOS-build-v${{ github.run_number }}
          path: frontend/ios/App/build
          retention-days: 7
        if: success()
