name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'
  GO_VERSION: '1.21'

jobs:
  # =========================================================================
  # LINT
  # =========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Lint Go
        run: |
          go install golang.org/x/tools/cmd/golangci-lint@latest
          cd nexachain && golangci-lint run ./...

      - name: Lint Backend
        run: |
          cd backend && npm ci
          npm run lint

      - name: Lint Frontend
        run: |
          cd frontend && npm ci
          npm run lint

  # =========================================================================
  # TEST BLOCKCHAIN
  # =========================================================================
  test-blockchain:
    name: Test Blockchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go Mod
        run: |
          cd nexachain
          go mod download
          go mod verify

      - name: Test
        run: |
          cd nexachain
          go test -v -race -coverprofile=coverage.out ./...

      - name: Coverage
        uses: actions/upload-artifact@v4
        with:
          name: blockchain-coverage
          path: nexachain/coverage.out

  # =========================================================================
  # TEST BACKEND
  # =========================================================================
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Tests
        run: |
          cd backend
          npm test -- --coverage

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

  # =========================================================================
  # TEST FRONTEND
  # =========================================================================
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Tests
        run: |
          cd frontend
          npm test -- --coverage --passWithNoTests

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  # =========================================================================
  # BUILD
  # =========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-blockchain, test-backend, test-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Blockchain
        run: |
          cd nexachain
          go build -o ../build/nexachain ./cmd/nexachain

      - name: Build Backend
        run: |
          cd backend
          npm ci
          npm run build

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/
            backend/dist/
            frontend/.next/

  # =========================================================================
  # DOCKER BUILD
  # =========================================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Blockchain
        uses: docker/build-push-action@v5
        with:
          context: ./nexachain
          push: true
          tags: railancosta/nexastream-blockchain:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: railancosta/nexastream-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: railancosta/nexastream-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # SECURITY SCAN
  # =========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # =========================================================================
  # DEPLOY (Main Branch Only)
  # =========================================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [docker, security]
    environment:
      name: production
      url: https://nexastream.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/nexastream
            git pull origin main
            docker-compose pull
            docker-compose up -d
            docker system prune -f

  # =========================================================================
  # NOTIFY
  # =========================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test-blockchain, test-backend, test-frontend, build, docker, security, deploy]
    steps:
      - name: Discord Notification
        if: github.event_name == 'push'
        uses: sarisia/actions-discord-webhook@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          username: GitHub Actions
          content: |
            **NexaStream CI/CD ${{ job.status }}**
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
