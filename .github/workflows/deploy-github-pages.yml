name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p ./site
          # Copy ONLY non-conflicting static assets (manifest, icons, sw.js).
          # Explicitly EXCLUDE index.html from frontend/public to avoid
          # overwriting the canonical homepage.
          if [ -d frontend/public ]; then
            for f in frontend/public/*; do
              base=$(basename "$f")
              if [ "$base" != "index.html" ] && [ "$base" != "CNAME" ]; then
                cp -r "$f" ./site/ 2>/dev/null || true
              fi
            done
          fi
          # Canonical homepage (always last — wins over anything).
          cp index.html ./site/index.html
          # CNAME for nexastream.org.
          echo "nexastream.org" > ./site/CNAME
          # Verify the correct file is in place.
          echo "=== index.html head ==="
          head -3 ./site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
