name: Deploy Smart Contracts

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy'
        required: true
        default: 'sepolia'
        type: choice
        options:
          - sepolia
          - baseSepolia
          - zoraTestnet
          - celoAlfajores
          - gnosisChiado
          - polygonZkEVMTestnet
          - base
          - zora
          - celo
          - gnosis
          - polygonZkEVM

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd contracts
          npm install

      - name: Deploy Contracts
        id: deploy
        run: |
          cd contracts
          npx hardhat run deploy.js --network ${{ github.event.inputs.network }}
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          ZORA_TESTNET_RPC_URL: ${{ secrets.ZORA_TESTNET_RPC_URL }}
          ZORA_RPC_URL: ${{ secrets.ZORA_RPC_URL }}
          CELO_ALFAJORES_RPC_URL: ${{ secrets.CELO_ALFAJORES_RPC_URL }}
          CELO_RPC_URL: ${{ secrets.CELO_RPC_URL }}
          GNOSIS_CHIADO_RPC_URL: ${{ secrets.GNOSIS_CHIADO_RPC_URL }}
          GNOSIS_RPC_URL: ${{ secrets.GNOSIS_RPC_URL }}
          POLYGON_ZKEVM_TESTNET_RPC_URL: ${{ secrets.POLYGON_ZKEVM_TESTNET_RPC_URL }}
          POLYGON_ZKEVM_RPC_URL: ${{ secrets.POLYGON_ZKEVM_RPC_URL }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          CELOSCAN_API_KEY: ${{ secrets.CELOSCAN_API_KEY }}
          GNOSISSCAN_API_KEY: ${{ secrets.GNOSISSCAN_API_KEY }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}

      - name: Upload deployment addresses
        uses: actions/upload-artifact@v4
        with:
          name: deployment-addresses-${{ github.event.inputs.network }}
          path: contracts/deployment-addresses.json
          retention-days: 30

      - name: Display deployed addresses
        run: |
          echo "=== Deployed Contracts ==="
          cat contracts/deployment-addresses.json
