name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p ./site
          # Use the canonical homepage as the site root.
          cp index.html ./site/index.html
          # Copy supporting static assets (manifest, icons, service worker, etc.).
          if [ -d frontend/public ]; then
            cp -r frontend/public/. ./site/ 2>/dev/null || true
          fi
          # Ensure the homepage from root wins over any copied index.html.
          cp index.html ./site/index.html
          # CNAME for nexastream.org.
          echo "nexastream.org" > ./site/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
