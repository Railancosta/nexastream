name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p ./site
          cp index.html ./site/index.html
          cp platform.html ./site/platform.html 2>/dev/null || true
          cp frontend/public/manifest.json ./site/manifest.json 2>/dev/null || true
          cp frontend/public/sw.js ./site/sw.js 2>/dev/null || true
          cp frontend/public/app.js ./site/app.js 2>/dev/null || true
          echo "nexastream.org" > ./site/CNAME
          touch ./site/.nojekyll
          echo "=== VERIFY index.html exists ==="
          ls -la ./site/index.html
          head -2 ./site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
