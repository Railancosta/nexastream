name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check dos servicos
        run: |
          for f in services/lib/sqlite.js services/core/server.js services/content/server.js services/chain/server.js services/chain/explorer.js services/monitor/server.js p2p/p2p.js; do
            node --check "$f" && echo "OK $f"
          done
      - name: Teste unitario da blockchain
        run: |
          cd services/chain
          node server.js &
          node explorer.js &
          sleep 3
          node test-chain.mjs
      - name: Testes do core e do gateway de monetizacao
        run: |
          RATE_LIMIT_MAX=100000 JWT_SECRET=test_secret node services/core/server.js &
          sleep 3
          node services/core/test-core.mjs
          node services/core/test-monetization.mjs
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Pipeline de video de ponta a ponta
        run: |
          ffmpeg -y -f lavfi -i testsrc=size=640x360:rate=30:duration=45 \
                 -f lavfi -i sine=frequency=440:duration=45 \
                 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/e2e_short.mp4
          ffmpeg -y -f lavfi -i testsrc=size=1280x720:rate=30:duration=120 \
                 -f lavfi -i sine=frequency=440:duration=120 \
                 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/e2e_long.mp4
          node apps/android/pipeline-test.mjs
      - name: Contrato da API consumida pelo app Android
        run: node apps/android/contract-test.mjs
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The runner image preinstalls an sdkmanager older than this action
          # expects; the default 'tools' package no longer exists in the SDK
          # repository and makes the step fail before Gradle ever runs.
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes unitarios do app
        run: ./gradlew :app:testDebugUnitTest
      - name: Compilar APK de debug
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nexastream-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  platform:
    name: Plataforma web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The root app is the actual web platform (src/app). It uses Tailwind via
      # the root postcss.config.mjs, so it needs the root install.
      - run: npm ci
      - run: npm run build
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # apps/web has no dependencies (static PWA shell built by build.mjs),
      # so there is no lockfile to cache or install from.
      - run: npm run build
      - name: Verificar que o bundle estatico foi gerado
        run: |
          for f in out/index.html out/app.js out/style.css out/manifest.webmanifest; do
            test -f "$f" || { echo "faltando: $f"; exit 1; }
          done
