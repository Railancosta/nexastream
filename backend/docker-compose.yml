version: '3.8'

services:
  api:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-nexastream-secret-key-change-me}
      - FRONTEND_URL=https://nexastream.org
    restart: unless-stopped
