name: Phase 0 CI

on:
  push:
    branches: [main, phase-0-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect accidental secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate root package metadata
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: npm audit
        run: npm audit --audit-level=high

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip black
      - run: black --check .

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Test discovered Go modules
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' mod; do
            found=1
            dir="$(dirname "$mod")"
            (cd "$dir" && go test ./... && go vet ./...)
          done < <(find services blockchain p2p -name go.mod -print0)
          if [ "$found" -eq 0 ]; then echo 'No Go modules yet; scaffold-only check passed.'; fi

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Check discovered Cargo projects
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' manifest; do
            dir="$(dirname "$manifest")"
            (cd "$dir" && cargo fmt --all -- --check && cargo clippy --all-targets --all-features -- -D warnings)
          done < <(find p2p blockchain -name Cargo.toml -print0)

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
