# NexaStream Ingress Configuration
# Production-ready with TLS and routing

---
# Ingress Controller (NGINX)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexastream-ingress
  namespace: nexastream
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/websocket-services: "nexachain-node"
    nginx.ingress.kubernetes.io/use-regex: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nexastream.org
        - www.nexastream.org
        - api.nexastream.org
        - explorer.nexastream.org
        - wallet.nexastream.org
        - cdn.nexastream.org
      secretName: nexastream-tls
  rules:
    # Main Application
    - host: nexastream.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexastream-frontend
                port:
                  number: 3000
    # WWW Redirect
    - host: www.nexastream.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexastream-frontend
                port:
                  number: 3000
    # API Backend
    - host: api.nexastream.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexastream-backend
                port:
                  number: 3001
    # Blockchain Explorer
    - host: explorer.nexastream.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexachain-node
                port:
                  number: 8545
    # Blockchain RPC
    - host: rpc.nexastream.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexachain-node
                port:
                  number: 8545
    # CDN Storage
    - host: cdn.nexastream.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexastream-storage
                port:
                  number: 9000
---
# Certificate (managed by cert-manager)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nexastream-cert
  namespace: nexastream
spec:
  secretName: nexastream-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - nexastream.org
    - "*.nexastream.org"
---
# ClusterIssuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@nexastream.org
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
---
# ClusterIssuer Staging (for testing)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@nexastream.org
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          ingress:
            class: nginx
