name: Build Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install deps
        run: pnpm install --frozen-lockfile=false

      - name: Build shared
        run: pnpm --filter @nexastream/shared run build

      - name: Prepare web assets
        run: |
          mkdir -p frontend/out
          cp index.html frontend/out/index.html
          cp app.js frontend/out/app.js
          cp frontend/public/manifest.json frontend/out/manifest.json 2>/dev/null || true
          cp frontend/public/sw.js frontend/out/sw.js 2>/dev/null || true
          echo "nexastream.org" > frontend/out/CNAME

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexastream-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/android/app/build/outputs/apk/debug/*.apk
            frontend/out/index.html
            frontend/out/app.js
            frontend/out/manifest.json
          body: |
            NexaStream v0.4.0 — Android APK + Web App
            
            ## Downloads:
            - **Android APK**: baixe o arquivo .apk abaixo
            - **PWA**: visite https://nexastream.org/ e instale como app
            - **Windows/Mac/Linux/iOS**: instale o PWA pelo navegador
            
            ## Features:
            - MAINNET LIVE (NST mining ativo)
            - Web3 wallet login (MetaMask, 500+ wallets)
            - Post-Quantum cryptography
            - IPFS storage
            - DAO governance
            - NFTs
            - AI recommendations
            - 10 languages
            - Binance API (buy/sell crypto)
            
            ## Mining NST:
            O app permite minerar NST via Proof of Work (50 NST/block).
            
            347+ tests passing.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
