<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaStream - Page Not Found</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
        h1{font-size:48px;margin-bottom:16px;background:linear-gradient(135deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        p{color:#71717a;font-size:18px;margin-bottom:24px}
        a{display:inline-block;padding:12px 24px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;text-decoration:none;border-radius:10px;font-weight:600}
    </style>
</head>
<body>
    <h1>404</h1>
    <p>Page not found. Redirecting to home...</p>
    <a href="/">Go to Home</a>
    <script>setTimeout(()=>window.location.href='/',2000)</script>
</body>
</html>
