name: Deploy site
on:
  push:
    branches: [main]
    paths: ['apps/site/**', 'apps/web/**', '.github/workflows/deploy-site.yml']
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build portal
        run: cd apps/site && npm ci && npm run build
      - name: Build platform UI (static)
        run: cd apps/web && npm ci && STATIC_EXPORT=1 npm run build
      - name: Merge outputs
        run: |
          mkdir -p out/app
          cp -r apps/site/out/* out/
          cp -r apps/web/out/* out/app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
